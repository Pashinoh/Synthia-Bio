<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Rounded Rect Container for iOS -->
  <rect width="180" height="180" rx="40" fill="#0B0F17" />
  <rect x="1" y="1" width="178" height="178" rx="39" stroke="#1E293B" stroke-width="2" />

  <defs>
    <linearGradient id="appleGrad" x1="30" y1="30" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base pair rungs -->
  <g stroke="#334155" stroke-width="6" stroke-linecap="round">
    <line x1="55" y1="50" x2="125" y2="50" opacity="0.6"/>
    <line x1="65" y1="72" x2="115" y2="72" opacity="0.8"/>
    <line x1="80" y1="90" x2="100" y2="90" opacity="1"/>
    <line x1="65" y1="108" x2="115" y2="108" opacity="0.8"/>
    <line x1="55" y1="130" x2="125" y2="130" opacity="0.6"/>
  </g>

  <!-- Left Strand Wave (S-Helix) -->
  <path d="M 55 40 C 55 65, 125 75, 125 95 C 125 115, 55 125, 55 140" 
        stroke="url(#appleGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        filter="url(#appleGlow)" />

  <!-- Right Strand Wave -->
  <path d="M 125 40 C 125 65, 55 75, 55 95 C 55 115, 125 125, 125 140" 
        stroke="#00F0FF" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Atoms / Nodes -->
  <circle cx="55" cy="40" r="8" fill="#00F0FF" />
  <circle cx="125" cy="40" r="8" fill="#38BDF8" />
  <circle cx="90" cy="70" r="7" fill="#10B981" />
  <circle cx="90" cy="110" r="7" fill="#00F0FF" />
  <circle cx="55" cy="140" r="8" fill="#10B981" />
  <circle cx="125" cy="140" r="8" fill="#059669" />
</svg>
