<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="16" fill="#0B0F17" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#1E293B" />

  <defs>
    <!-- Cyan to Emerald Gradient (Theme Colors) -->
    <linearGradient id="helixGrad1" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="helixGrad2" x1="52" y1="12" x2="12" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base pair rungs / bonds connecting the helix -->
  <g stroke="#334155" stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="18" x2="44" y2="18" opacity="0.6"/>
    <line x1="23" y1="26" x2="41" y2="26" opacity="0.8"/>
    <line x1="28" y1="32" x2="36" y2="32" opacity="1"/>
    <line x1="23" y1="38" x2="41" y2="38" opacity="0.8"/>
    <line x1="20" y1="46" x2="44" y2="46" opacity="0.6"/>
  </g>

  <!-- Left Strand Wave (Stylized S-Helix) -->
  <path d="M 20 14 C 20 22, 44 26, 44 34 C 44 42, 20 46, 20 50" 
        stroke="url(#helixGrad1)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Right Strand Wave (Complementary) -->
  <path d="M 44 14 C 44 22, 20 26, 20 34 C 20 42, 44 46, 44 50" 
        stroke="url(#helixGrad2)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        opacity="0.9" />

  <!-- Interactive Nodes / Atoms -->
  <circle cx="20" cy="14" r="3" fill="#00F0FF" />
  <circle cx="44" cy="14" r="3" fill="#38BDF8" />
  <circle cx="32" cy="24" r="2.5" fill="#10B981" />
  <circle cx="32" cy="40" r="2.5" fill="#00F0FF" />
  <circle cx="20" cy="50" r="3" fill="#10B981" />
  <circle cx="44" cy="50" r="3" fill="#059669" />
</svg>
